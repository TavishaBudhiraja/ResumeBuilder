<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Resume Builder</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --primary-dark: #111827;
            --accent: #c026d3;
            --accent-2: #7c3aed;
            --soft-bg: #f6f7fb;
            --card-bg: rgba(255, 255, 255, 0.96);
            --border: #e5e7eb;
            --text-main: #111827;
            --text-muted: #6b7280;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at top left, #ffd1e3 0, transparent 30%),
                radial-gradient(circle at bottom right, #c9f1ff 0, transparent 30%),
                var(--soft-bg);
            font-family: Arial, sans-serif;
            color: var(--text-main);
        }

        .page-wrapper {
            width: 100%;
            max-width: 1040px;
            margin: 0 auto;
            padding: 30px 14px;
        }

        .hero {
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: white;
            border-radius: 28px;
            padding: 34px 30px;
            margin-bottom: 24px;
            box-shadow: 0 18px 45px rgba(124, 58, 237, 0.24);
        }

        .hero-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 18px;
        }

        .hero h1 {
            font-size: 44px;
            font-weight: 900;
            margin-bottom: 6px;
            letter-spacing: -1px;
        }

        .hero p {
            margin-bottom: 0;
            color: rgba(255, 255, 255, 0.88);
            font-size: 16px;
        }

        .logout-form {
            margin: 0;
            flex-shrink: 0;
        }

        .btn-logout {
            background: white;
            color: var(--primary-dark);
            border: none;
            border-radius: 999px;
            padding: 10px 22px;
            font-weight: 900;
        }

        .form-card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 28px;
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.75);
        }

        .section-box {
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 22px;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 21px;
            font-weight: 900;
            margin-bottom: 18px;
            color: var(--primary-dark);
            padding-bottom: 10px;
            border-bottom: 2px solid var(--border);
            position: relative;
        }

        .section-title::after {
            content: "";
            width: 72px;
            height: 2px;
            background: var(--accent);
            position: absolute;
            bottom: -2px;
            left: 0;
        }

        label {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 7px;
            color: #333;
        }

        .form-control,
        .form-select {
            border-radius: 12px;
            border: 1px solid #dfe3ea;
            padding: 11px 13px;
            font-size: 14px;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 0.18rem rgba(192, 38, 211, 0.14);
        }

        textarea {
            resize: vertical;
        }

        .field-note {
            font-size: 12.5px;
            color: var(--text-muted);
            margin-top: 6px;
        }

        .btn-submit {
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: white;
            border: none;
            border-radius: 14px;
            padding: 14px;
            font-weight: 900;
            box-shadow: 0 12px 25px rgba(124, 58, 237, 0.25);
        }

        .btn-submit:hover {
            color: white;
            transform: translateY(-1px);
            box-shadow: 0 15px 30px rgba(124, 58, 237, 0.32);
        }

        .btn-add {
            border-radius: 10px;
            font-weight: 800;
            font-size: 13px;
            padding: 8px 12px;
        }

        .repeat-box {
            margin-top: 10px;
        }

        .repeat-field-row {
            display: flex;
            gap: 10px;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .remove-btn {
            min-width: 38px;
            height: 38px;
            border-radius: 10px;
            font-weight: 900;
            line-height: 1;
        }

        @media (max-width: 768px) {
            .page-wrapper {
                padding: 18px 10px;
            }

            .hero {
                padding: 24px 18px;
                border-radius: 20px;
                margin-bottom: 18px;
            }

            .hero-inner {
                flex-direction: column;
                text-align: center;
            }

            .hero h1 {
                font-size: 30px;
            }

            .hero p {
                font-size: 14px;
            }

            .form-card {
                padding: 16px;
                border-radius: 18px;
            }

            .section-box {
                padding: 16px;
                border-radius: 15px;
                margin-bottom: 16px;
            }

            .section-title {
                font-size: 19px;
                margin-bottom: 14px;
            }
        }

        @media (max-width: 480px) {
            .page-wrapper {
                padding: 12px 8px;
            }

            .hero {
                padding: 22px 14px;
                border-radius: 18px;
            }

            .hero h1 {
                font-size: 27px;
            }

            .form-card {
                padding: 12px;
            }

            .section-box {
                padding: 14px;
            }

            .repeat-field-row {
                flex-direction: column;
            }

            .remove-btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="page-wrapper">

    <div class="hero">
        <div class="hero-inner">
            <div>
                <h1>Resume Builder</h1>
                <p>Select a design, choose a theme, and generate a polished resume.</p>
            </div>

            <form method="POST" action="{% url 'logout' %}" class="logout-form">
                {% csrf_token %}
                <button type="submit" class="btn btn-logout">
                    Sign Out
                </button>
            </form>
        </div>
    </div>

    <div class="form-card">
        <form method="POST">
            {% csrf_token %}

            <div class="section-box">
                <h4 class="section-title">Template & Theme</h4>

                <div class="row g-3">
                    <div class="col-12 col-md-6">
                        <label>Select Resume Template</label>

                        <select name="template_choice" class="form-select" required>
                            {% for value, label in template_choices %}
                                <option value="{{ value }}">{{ label }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-12 col-md-6">
                        <label>Select Color Theme</label>

                        <select name="color_theme" class="form-select" required>
                            {% for value, label in color_choices %}
                                <option value="{{ value }}">{{ label }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
            </div>

            <div class="section-box">
                <h4 class="section-title">Personal Details</h4>

                <div class="row g-3">
                    <div class="col-12 col-md-6">
                        <label>Full Name</label>
                        <input type="text" name="full_name" class="form-control" placeholder="Example: Riya Sharma" required>
                    </div>

                    <div class="col-12 col-md-6">
                        <label>Email</label>
                        <input type="email" name="email" class="form-control" placeholder="name@email.com" required>
                    </div>

                    <div class="col-12 col-md-6">
                        <label>Phone</label>
                        <input type="text" name="phone" class="form-control" placeholder="+91 98765 43210" required>
                    </div>

                    <div class="col-12 col-md-6">
                        <label>Address</label>
                        <input type="text" name="address" class="form-control" placeholder="City, State">
                    </div>

                    <div class="col-12 col-md-6">
                        <label>LinkedIn URL</label>
                        <input type="url" name="linkedin" class="form-control" placeholder="https://linkedin.com/in/...">
                    </div>

                    <div class="col-12 col-md-6">
                        <label>GitHub URL</label>
                        <input type="url" name="github" class="form-control" placeholder="https://github.com/...">
                    </div>
                </div>
            </div>

            <div class="section-box">
                <h4 class="section-title">Resume Content</h4>

                <div class="row g-3">
                    <div class="col-12">
                        <label>Career Objective</label>
                        <textarea name="career_objective" class="form-control" rows="4" placeholder="Write a short professional summary..." required></textarea>
                    </div>

                    <div class="col-12">
                        <label>Skills</label>
                        <input type="text" name="skills" class="form-control" placeholder="Python, Django, HTML, CSS, Bootstrap" required>
                        <div class="field-note">Separate skills using commas.</div>
                    </div>

                    <div class="col-12">
                        <label>Education</label>

                        <div id="education-wrapper">
                            <textarea name="education" class="form-control mb-2" rows="3" placeholder="Degree, college, year, key achievements" required></textarea>
                        </div>

                        <button type="button" class="btn btn-outline-dark btn-sm btn-add mt-1" onclick="addMore('education-wrapper', 'education', 'Degree, college, year, key achievements')">
                            + Add More Education
                        </button>
                    </div>

                    <div class="col-12">
                        <label>Work Experience</label>

                        <div id="experience-wrapper">
                            <textarea name="experience" class="form-control mb-2" rows="3" placeholder="Internship, job, responsibilities, achievements"></textarea>
                        </div>

                        <button type="button" class="btn btn-outline-dark btn-sm btn-add mt-1" onclick="addMore('experience-wrapper', 'experience', 'Internship, job, responsibilities, achievements')">
                            + Add More Experience
                        </button>
                    </div>

                    <div class="col-12">
                        <label>Projects</label>

                        <div id="projects-wrapper">
                            <textarea name="projects" class="form-control mb-2" rows="3" placeholder="Project name, technology used, what it does"></textarea>
                        </div>

                        <button type="button" class="btn btn-outline-dark btn-sm btn-add mt-1" onclick="addMore('projects-wrapper', 'projects', 'Project name, technology used, what it does')">
                            + Add More Project
                        </button>
                    </div>

                    <div class="col-12">
                        <label>Certifications</label>

                        <div id="certifications-wrapper">
                            <textarea name="certifications" class="form-control mb-2" rows="3" placeholder="Course name, platform, year"></textarea>
                        </div>

                        <button type="button" class="btn btn-outline-dark btn-sm btn-add mt-1" onclick="addMore('certifications-wrapper', 'certifications', 'Course name, platform, year')">
                            + Add More Certification
                        </button>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn btn-submit w-100">
                Generate Resume
            </button>
        </form>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<script>
    function addMore(wrapperId, fieldName, placeholderText) {
        const wrapper = document.getElementById(wrapperId);

        const fieldBox = document.createElement("div");
        fieldBox.className = "repeat-box";

        fieldBox.innerHTML = `
            <div class="repeat-field-row">
                <textarea name="${fieldName}" class="form-control" rows="3" placeholder="${placeholderText}"></textarea>

                <button type="button" class="btn btn-outline-danger btn-sm remove-btn" onclick="removeField(this)">
                    ×
                </button>
            </div>
        `;

        wrapper.appendChild(fieldBox);
    }

    function removeField(button) {
        button.closest(".repeat-box").remove();
    }
</script>

</body>
</html>
