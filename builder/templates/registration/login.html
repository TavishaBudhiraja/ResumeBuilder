<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Sign In - Resume Builder</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at top left, #ffd1e3 0, transparent 30%),
                radial-gradient(circle at bottom right, #c9f1ff 0, transparent 30%),
                #f6f7fb;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            background: rgba(255,255,255,0.96);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 18px 45px rgba(0,0,0,0.10);
            border: 1px solid rgba(255,255,255,0.75);
        }

        .login-title {
            font-size: 32px;
            font-weight: 900;
            margin-bottom: 6px;
            text-align: center;
        }

        .login-subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 24px;
        }

        label {
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 7px;
        }

        .form-control {
            border-radius: 12px;
            padding: 11px 13px;
            font-size: 14px;
        }

        .form-control:focus {
            border-color: palevioletred;
            box-shadow: 0 0 0 0.18rem rgba(216, 112, 147, 0.18);
        }

        .btn-login {
            background: linear-gradient(135deg, palevioletred, #7c3aed);
            color: white;
            border: none;
            border-radius: 14px;
            padding: 13px;
            font-weight: 900;
            box-shadow: 0 12px 25px rgba(124,58,237,0.25);
        }

        .btn-login:hover {
            color: white;
            transform: translateY(-1px);
        }

        .error-box {
            background: #fee2e2;
            color: #991b1b;
            border-radius: 12px;
            padding: 10px 12px;
            font-size: 14px;
            margin-bottom: 16px;
        }

        .signup-link-box {
            text-align: center;
            margin-top: 20px;
            padding-top: 18px;
            border-top: 1px solid #e5e7eb;
            color: #6b7280;
            font-weight: 700;
            font-size: 14px;
        }

        .signup-link-box a {
            color: #7c3aed;
            font-weight: 900;
            text-decoration: none;
        }

        .signup-link-box a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="login-card">
    <h1 class="login-title">Sign In</h1>
    <p class="login-subtitle">Access your resume builder.</p>

    {% if form.errors %}
        <div class="error-box">
            Invalid username or password.
        </div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
            <label>Username</label>
            <input type="text" name="username" class="form-control" required autofocus>
        </div>

        <div class="mb-3">
            <label>Password</label>
            <input type="password" name="password" class="form-control" required>
        </div>

        <button type="submit" class="btn btn-login w-100">
            Sign In
        </button>
    </form>

    <div class="signup-link-box">
        Don't have an account?
        <a href="{% url 'signup' %}">Create Account</a>
    </div>
</div>

</body>
</html>
